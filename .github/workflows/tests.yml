name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run FIT patcher and catalog tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: |
          python -m compileall -q custom_components/garmin_fit_device_changer
          python -m py_compile scripts/update_garmin_catalog.py
      - name: Check Lovelace card JavaScript syntax
        run: node --check custom_components/garmin_fit_device_changer/www/garmin-fit-device-changer-card.js
